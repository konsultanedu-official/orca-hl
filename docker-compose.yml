services:
  orca:
    image: ${ORCA_IMAGE:-ghcr.io/konsultanedu-official/orca-hl}:${ORCA_TAG:-latest}
    restart: unless-stopped

    # Keep the base Compose orchestrator-neutral. Reverse proxies such as
    # Coolify/Traefik can route directly to this internal container port.
    expose:
      - "6768"

    # Chromium/Electron is much more reliable with more than Docker's default
    # 64 MiB /dev/shm.
    shm_size: "1gb"

    environment:
      ORCA_PORT: "6768"
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS}
      ORCA_JSON_READY: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Optional portable OpenCode -> self-hosted 9Router configuration.
      # The entrypoint bootstraps opencode.json only on a fresh config volume
      # and never overwrites an existing operator-managed file.
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}

    volumes:
      - orca-config:/home/orca/.config/orca
      - orca-electron-config:/home/orca/.config/Orca
      - opencode-config:/home/orca/.config/opencode
      - opencode-data:/home/orca/.local/share/opencode
      - codex-home:/home/orca/.codex
      - claude-home:/home/orca/.claude
      - orca-projects:/projects
      - orca-workspaces:/home/orca/orca/workspaces
      - orca-agent-skills:/home/orca/.agents
      - github-cli-config:/home/orca/.config/gh

volumes:
  orca-config:
  orca-electron-config:
  opencode-config:
  opencode-data:
  codex-home:
  claude-home:
  orca-projects:
  orca-workspaces:
  orca-agent-skills:
  github-cli-config:
